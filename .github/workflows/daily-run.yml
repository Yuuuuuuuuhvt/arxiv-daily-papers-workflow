name: Daily Papers Agent

on:
  schedule:
    - cron: '30 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}

      - name: Prepare git state
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "arxiv-agent[bot]"
          git config user.email "bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git checkout -B main origin/main

          git submodule update --init --depth 1 data

          git -C data config user.name "arxiv-agent[bot]"
          git -C data config user.email "bot@users.noreply.github.com"
          git -C data remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/Yuuuuuuuuhvt/embodied-daily-papers.git"
          git -C data fetch origin main
          git -C data checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          QQ_MAIL_ADDRESS: ${{ secrets.QQ_MAIL_ADDRESS }}
          SKIP_GIT_PUSH: "1"
        run: python -m src.main

      - name: Upload PDF release assets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          date_str=$(date -u +%Y-%m-%d)
          tag="v${date_str}"
          pdf_dir="storage/pdfs/${date_str}"
          if [ -d "$pdf_dir" ]; then
            shopt -s nullglob
            pdfs=("$pdf_dir"/*.pdf)
            valid_pdfs=()
            for pdf in "${pdfs[@]}"; do
              size=$(stat -c%s "$pdf" 2>/dev/null || stat -f%z "$pdf" 2>/dev/null || wc -c < "$pdf")
              if [ "$size" -le 2147483648 ]; then
                valid_pdfs+=("$pdf")
              else
                echo "Warning: $pdf exceeds 2 GiB ($size bytes), skipping release asset upload."
              fi
            done
            if [ ${#valid_pdfs[@]} -gt 0 ]; then
              gh release create "$tag" "${valid_pdfs[@]}" \
                --title "arXiv Papers ${date_str}" \
                --notes "Daily papers for ${date_str}" \
                || gh release upload "$tag" "${valid_pdfs[@]}" --clobber
            fi
          fi

      - name: Commit and push data submodule
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "arxiv-agent[bot]"
          git config user.email "bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git"
          git -C data remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/Yuuuuuuuuhvt/embodied-daily-papers.git"

          git -C data add -A
          if ! git -C data diff --cached --quiet; then
            git -C data commit -m "daily update: $(date -u +%Y-%m-%d)"
            git -C data pull --rebase origin main
            git -C data push origin HEAD:main
          fi

          git add data
          if ! git diff --cached --quiet; then
            git commit -m "update data submodule pointer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
