models:
  relevance_filter:
    provider: "openrouter"
    model_id: "google/gemini-2.5-flash"
    temperature: 0.1
    batch_size: 10

  deep_analysis:
    provider: "openrouter"
    model_id: "google/gemini-3.1-pro-preview"
    temperature: 0.2
    batch_size: 1

research_focus:
  description: |
    We follow six complementary research directions: embodied AI and VLA,
    world models, autonomous driving, agentic AI, robotics, and 3DGS,
    3D reconstruction and simulation scenes.
    Each direction is independently relevant; a paper does not need to combine
    world models and VLA to receive a high focus relevance score.
    - World models, learned dynamics, simulation, and model-based planning
    - VLA models, robot foundation models, and learned action generation
    - Autonomous driving perception, prediction, planning, and evaluation
    - Software, web, GUI, and coding agents; tool use, memory, context,
      long-horizon planning, multi-agent coordination, and agent evaluation
    - Robot manipulation, locomotion, navigation, SLAM, perception, tactile
      sensing, control, sim-to-real, hardware, and robotics benchmarks
    - Gaussian splatting, NeRF, 3D and 4D scene reconstruction, novel view
      synthesis, simulation-ready assets, scene generation and editing,
      physical properties, collision, interactivity, and rendering efficiency
    Agentic research does not require a physical robot. Robotics contributions
    can use classical control or smaller learned models; absence of a foundation
    model is not a reason to lower their relevance. Scene reconstruction papers
    need a 3D scene contribution, not a robot experiment or foundation model. Judge the actual contribution
    and evidence rather than isolated keywords or the application label.
  high_keywords:
    - "world model"
    - "VLA"
    - "vision-language-action"
    - "action generation"
    - "diffusion policy"
    - "robot policy"
    - "manipulation"
    - "locomotion"
    - "sim-to-real"
    - "model-based reinforcement learning"
    - "latent dynamics"
    - "JEPA"
    - "agentic"
    - "tool use"
    - "agent memory"
    - "multi-agent"
    - "coding agent"
    - "robotics"
    - "robot navigation"
    - "SLAM"
    - "robot control"
    - "tactile sensing"
    - "Gaussian splatting"
    - "scene reconstruction"
    - "simulation-ready"
    - "novel view synthesis"
  low_keywords: []

scoring:
  weights:
    novelty: 0.20
    impact: 0.25
    reproducibility: 0.10
    affiliation: 0.10
    direction_match: 0.10
    focus_relevance: 0.25
  hot_threshold: 4.0

email:
  max_highlights_in_email: 3

budget:
  max_output_tokens: 16384
  models:
    google/gemini-2.5-flash:
      prompt_price_per_million: 0.3
      completion_price_per_million: 2.5
    google/gemini-3.1-pro-preview:
      prompt_price_per_million: 4
      completion_price_per_million: 18
    google/gemini-4-argon:
      prompt_price_per_million: 2
      completion_price_per_million: 10

concurrency:
  max_concurrent_llm: 10
  max_concurrent_pdf: 5

paper_input:
  prefer_latex: true  # Source text and every referenced image; complete PDF pages on failure.

pdf:
  download_enabled: true
  storage_dir: "storage/pdfs"
  transport: "base64"  # Optional URL input is limited to PDFs up to 5 MiB.
  require_pdf: false  # True makes missing or failed PDFs an error, with no abstract fallback.

hjfy:
  enabled: false
  base_url: "https://hjfy.top"
  link_template: "https://hjfy.top/arxiv/{arxiv_id}"
  download_pdfs: false
